name: Release APK

# Pushing a v* tag builds the APK and attaches it to that release, so a release is
# never left without something to download. The signing key and passwords live in
# repository secrets; it is the same key the app has shipped with, so the new APK
# installs over the previous version and keeps the user's diary.
#
# Run it manually with a tag to (re)build and attach an older release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach, for example v1.1.0"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the tag
        id: tag
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Restore the signing key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_B64" ]; then
            echo "::error::SIGNING_KEYSTORE_B64 is not set; the APK could not be signed for an upgrade."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build the signed APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Release notes from the default branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: notes
          sparse-checkout: .github/release

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          APK="BulgarCalTracker-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          ls -l "$APK"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          NOTES="notes/.github/release/${TAG}.md"
          if [ -f "$NOTES" ]; then
            printf '\n**Контролна сума** — sha256:\n\n    %s\n' "$SHA" >> "$NOTES"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            if [ -f "$NOTES" ]; then gh release edit "$TAG" --notes-file "$NOTES"; fi
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" "$APK" --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" "$APK" --title "$TAG" --generate-notes
          fi
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'
